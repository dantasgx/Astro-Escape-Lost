<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astro Escape</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="topo">
    <h1>Astro Escape</h1>

    <nav>
      <a href="index.html">Início</a>
      <a href="dev.html">Desenvolvimento</a>
      <a href="jogo.html" class="btn-nav">Jogar</a>
    </nav>
  </header>

  <main class="pagina-jogo">

    <section class="jogo-container">
      <canvas id="gameCanvas" width="800" height="400"></canvas>
    </section>

    <section class="hud">
      <div class="hud-card">
        <p>❤️ Vidas</p>
        <span id="vidas">2</span>
      </div>

      <div class="hud-card">
        <p>🪐 Fase</p>
        <span id="fase">1</span>/4
      </div>

      <div class="hud-card">
        <p>🔧 Itens</p>
        <span id="itens">0</span>/2
      </div>

      <div class="hud-card">
        <p>☠️ Mortes</p>
        <span id="mortes">0</span>
      </div>
    </section>

    <section class="comandos-simples">
      <h2>Comandos</h2>

      <p>A / ← : mover para a esquerda</p>
      <p>D / → : mover para a direita</p>
      <p>W / ↑ : pular</p>
    </section>

  </main>

  <script src="js/assets.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/fases.js"></script>
  <script src="js/player.js"></script>
  <script src="js/desenho.js"></script>
  <script src="js/colisao.js"></script>
  <script src="js/telas.js"></script>
  <script src="js/controles.js"></script>
  <script src="js/game.js"></script>

</body>
</html>
